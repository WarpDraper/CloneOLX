server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets — cheap win for JS/CSS bundle transfer size.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA routing: any path that isn't a real static file falls back to index.html so
    # react-router-dom's client-side routes (e.g. /auth, /advert/123) don't 404 on refresh
    # or direct link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for hashed build assets (Vite fingerprints filenames), so browsers
    # never refetch a JS/CSS chunk that hasn't actually changed.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must never be cached — it's what points at the current hashed assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
